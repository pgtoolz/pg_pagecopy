[package]
name = "pg_pagecopy"
version = "0.0.1"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/pgtoolz/pg_pagecopy"
description = "Physical table transfer between PostgreSQL 13-18 clusters, including upward upgrades"
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg17"]
pg13 = ["pgrx/pg13"]
pg14 = ["pgrx/pg14"]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]
test-hooks = []

[dependencies]
pgrx = "=0.19.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
debug = true
